name: Release Modules

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to auto-increment patch)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Build verification
      # ------------------------------------------------------------

      - name: Check Build Modules
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Current commit: $CURRENT_SHA"

          BUILD="$(
            gh run list \
              --workflow build.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json headSha,databaseId \
              --jq '.[0] // empty'
          )"

          if [ -z "$BUILD" ]; then
            echo "No successful Build Modules run found"
            exit 1
          fi

          BUILD_SHA="$(echo "$BUILD" | jq -r '.headSha')"
          BUILD_ID="$(echo "$BUILD" | jq -r '.databaseId')"

          echo "Last successful build:"
          echo "  Run:    $BUILD_ID"
          echo "  Commit: $BUILD_SHA"

          if [ "$BUILD_SHA" = "$CURRENT_SHA" ]; then
            echo "Current commit has already passed Build Modules"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$BUILD_SHA" "$CURRENT_SHA"; then
            echo "Last successful build is not an ancestor of current commit"
            echo "Run Build Modules again"
            exit 1
          fi

          echo
          echo "Changes since successful build:"

          git diff \
            --name-only \
            "$BUILD_SHA" \
            "$CURRENT_SHA"

          BUILD_CHANGES="$(
            git diff \
              --name-only \
              "$BUILD_SHA" \
              "$CURRENT_SHA" \
              -- 'modules/'
          )"

          if [ -n "$BUILD_CHANGES" ]; then
            echo
            echo "Module changes detected since the last successful build:"
            echo "$BUILD_CHANGES"
            echo
            echo "Run Build Modules again before releasing"
            exit 1
          fi

          echo
          echo "No module changes since successful build"
          echo "Existing build is valid for release"

      # ------------------------------------------------------------
      # Version
      # ------------------------------------------------------------

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            LAST_VERSION="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-version:refname |
              head -n 1
            )"

            if [ -z "$LAST_VERSION" ]; then
              VERSION="v0.1.0"
            else
              RAW="${LAST_VERSION#v}"

              IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"

              PATCH=$((PATCH + 1))

              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v0.1.0"
            exit 1
          fi

          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package modules
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist

          for module in modules/*; do
            [ -d "$module" ] || continue

            name="$(basename "$module")"
            [[ "$name" == _* ]] && continue

            echo "Packaging $name"

            (
              cd modules
              zip -r "../dist/${name}-${VERSION}.zip" "$name" _common
            )
          done

      # ------------------------------------------------------------
      # Tag
      # ------------------------------------------------------------

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      # ------------------------------------------------------------
      # Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
