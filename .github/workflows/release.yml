name: Release Modules

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to auto-increment patch)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Build verification
      # ------------------------------------------------------------

      - name: Check Build Modules
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "Checking Build Modules for commit $SHA"

          CONCLUSION="$(
            gh run list \
              --workflow build.yml \
              --commit "$SHA" \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // empty'
          )"

          if [ "$CONCLUSION" != "success" ]; then
            echo "No successful Build Modules run found for commit $SHA"
            exit 1
          fi

          echo "Build Modules passed for commit $SHA"

      # ------------------------------------------------------------
      # Version
      # ------------------------------------------------------------

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            LAST_VERSION="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-version:refname |
              head -n 1
            )"

            if [ -z "$LAST_VERSION" ]; then
              VERSION="v0.1.0"
            else
              RAW="${LAST_VERSION#v}"

              IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"

              PATCH=$((PATCH + 1))

              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v0.1.0"
            exit 1
          fi

          echo "Release version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package modules
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist

          for module in modules/*; do
            [ -d "$module" ] || continue

            name="$(basename "$module")"

            [ "$name" = "_template" ] && continue

            echo "Packaging $name"

            (
              cd modules
              zip -r "../dist/${name}-${VERSION}.zip" "$name"
            )
          done

      # ------------------------------------------------------------
      # Tag
      # ------------------------------------------------------------

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      # ------------------------------------------------------------
      # Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
