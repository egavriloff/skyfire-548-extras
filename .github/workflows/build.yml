name: Build modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        module:
          - npc-teleport
          - npc-transmogrifier

    env:
      BOOST_VERSION: 1.91.0
      BOOST_VERSION_UNDERSCORE: 1_91_0
      BOOST_ROOT: ${{ github.workspace }}/boost

      OPENSSL_VERSION: 4.0.0
      OPENSSL_ROOT: ${{ github.workspace }}/openssl

    steps:
      - name: Checkout modules
        uses: actions/checkout@v4
        with:
          path: modules-repository

      - name: Checkout SkyFire
        uses: actions/checkout@v4
        with:
          repository: ProjectSkyfire/SkyFire_548
          path: skyfire
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            cmake \
            ninja-build \
            default-libmysqlclient-dev \
            libreadline-dev \
            curl \
            perl

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: boost-${{ runner.os }}-${{ env.BOOST_VERSION }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -L \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz" \
            -o boost.tar.gz

          mkdir -p "$BOOST_ROOT"

          tar \
            -xzf boost.tar.gz \
            --strip-components=1 \
            -C "$BOOST_ROOT"

          cd "$BOOST_ROOT"

          ./bootstrap.sh \
            --with-toolset=gcc \
            --prefix="$BOOST_ROOT"

          ./b2 \
            -j2 \
            variant=release \
            link=static \
            threading=multi \
            install

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_ROOT }}
          key: openssl-${{ runner.os }}-${{ env.OPENSSL_VERSION }}

      - name: Install OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -L \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz

          tar -xzf openssl.tar.gz

          cd "openssl-${OPENSSL_VERSION}"

          ./Configure \
            --prefix="$OPENSSL_ROOT" \
            --openssldir="$OPENSSL_ROOT/ssl"

          make -j2
          make install_sw

      - name: Install module
        run: |
          cp -R \
            "modules-repository/modules/${{ matrix.module }}" \
            "skyfire/modules/${{ matrix.module }}"

      - name: Configure SkyFire
        working-directory: skyfire
        env:
          CC: gcc-14
          CXX: g++-14
          OPENSSL_ROOT_DIR: ${{ env.OPENSSL_ROOT }}
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DSCRIPTS=ON \
            -DTOOLS=OFF \
            -DSKYFIRE_BUILD_TESTS=OFF

      - name: Build SkyFire
        working-directory: skyfire
        run: |
          cmake --build build --parallel 2
