name: Build Modules

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  BOOST_VERSION: "1.91.0"
  OPENSSL_VERSION: "4.0.1"

jobs:
  build:
    name: Build Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout modules
        uses: actions/checkout@v4

      - name: Checkout SkyFire
        uses: actions/checkout@v4
        with:
          repository: ProjectSkyfire/SkyFire_548
          path: skyfire
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            gcc-14 \
            g++-14 \
            libmysqlclient-dev \
            libreadline-dev \
            zlib1g-dev

      # ------------------------------------------------------------
      # Boost
      # ------------------------------------------------------------

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ~/.local/boost
          key: boost-${{ runner.os }}-${{ env.BOOST_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_1_91_0.tar.gz"

          tar -xzf boost_1_91_0.tar.gz
          cd boost_1_91_0

          ./bootstrap.sh \
            --prefix="$HOME/.local/boost"

          ./b2 \
            -j"$(nproc)" \
            install

      # ------------------------------------------------------------
      # OpenSSL
      # ------------------------------------------------------------

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/.local/openssl
          key: openssl-${{ runner.os }}-${{ env.OPENSSL_VERSION }}

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          wget -q \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"

          ./Configure \
            --prefix="$HOME/.local/openssl" \
            --openssldir="$HOME/.local/openssl" \
            enable-legacy

          make -j"$(nproc)"
          make install_sw

      # ------------------------------------------------------------
      # Compiler cache
      # ------------------------------------------------------------

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats

      # ------------------------------------------------------------
      # Modules
      # ------------------------------------------------------------

      - name: Install modules
        run: |
          for module in modules/*; do
            [ -d "$module" ] || continue

            name="$(basename "$module")"

            # Template is not built.
            [ "$name" = "_template" ] && continue

            echo "Installing $name"
            cp -R "$module" "skyfire/modules/$name"
          done

      # ------------------------------------------------------------
      # SkyFire
      # ------------------------------------------------------------

      - name: Configure SkyFire
        working-directory: skyfire
        env:
          BOOST_ROOT: ${{ env.HOME }}/.local/boost
          OPENSSL_ROOT_DIR: ${{ env.HOME }}/.local/openssl
          OPENSSL_MODULES: ${{ env.HOME }}/.local/openssl/lib64/ossl-modules
          CCACHE_DIR: ${{ env.HOME }}/.cache/ccache
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"

      - name: Build SkyFire + modules
        working-directory: skyfire
        env:
          CCACHE_DIR: ${{ env.HOME }}/.cache/ccache
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats
