name: AI Review

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "modules/**"
      - ".ci/ai-review/**"
      - ".github/workflows/ai-review.yml"

permissions:
  contents: read

jobs:
  detect:
    name: Detect modules
    runs-on: ubuntu-24.04

    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      count: ${{ steps.detect.outputs.count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modules
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          modules_dir = Path("modules")

          all_modules = sorted(
              path.name
              for path in modules_dir.iterdir()
              if path.is_dir()
              and not path.name.startswith(("_", "."))
          )

          event_name = os.environ["EVENT_NAME"]

          if event_name == "workflow_dispatch":
              selected = all_modules
          else:
              base_sha = os.environ["BASE_SHA"]
              head_sha = os.environ["HEAD_SHA"]

              result = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      base_sha,
                      head_sha,
                  ],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )

              changed_files = [
                  line.strip()
                  for line in result.stdout.splitlines()
                  if line.strip()
              ]

              review_infrastructure_changed = any(
                  path.startswith(".ci/ai-review/")
                  or path == ".github/workflows/ai-review.yml"
                  for path in changed_files
              )

              if review_infrastructure_changed:
                  selected = all_modules
              else:
                  changed_modules = set()

                  for path in changed_files:
                      parts = Path(path).parts

                      if (
                          len(parts) >= 2
                          and parts[0] == "modules"
                          and parts[1] in all_modules
                      ):
                          changed_modules.add(parts[1])

                  selected = sorted(changed_modules)

          modules_json = json.dumps(
              selected,
              separators=(",", ":"),
          )

          print("Modules selected for AI review:")

          if selected:
              for module in selected:
                  print(f"  - {module}")
          else:
              print("  None.")

          output_file = Path(
              os.environ["GITHUB_OUTPUT"]
          )

          with output_file.open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"modules={modules_json}\n"
              )
              output.write(
                  f"count={len(selected)}\n"
              )
          PY

  review:
    name: Review ${{ matrix.module }}
    needs: detect

    if: needs.detect.outputs.count != '0'

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}

    env:
      AI_DIR: ${{ github.workspace }}/.ai

      CODE_MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      CODE_MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

      DATA_MODEL_FILE: qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
      DATA_MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user PyYAML

      - name: Prepare AI directory
        run: |
          mkdir -p "$AI_DIR"

      - name: Restore code model cache
        id: cache-code-model
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.CODE_MODEL_FILE }}
          key: qwen25-coder-1.5b-q4km-v1

      - name: Download code model
        if: steps.cache-code-model.outputs.cache-hit != 'true'
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "$CODE_MODEL_URL" \
            -o "$AI_DIR/$CODE_MODEL_FILE"

      - name: Save code model cache
        if: steps.cache-code-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.CODE_MODEL_FILE }}
          key: qwen25-coder-1.5b-q4km-v1

      - name: Restore data model cache
        id: cache-data-model
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.DATA_MODEL_FILE }}
          key: qwen25-coder-0.5b-q4km-v1

      - name: Download data model
        if: steps.cache-data-model.outputs.cache-hit != 'true'
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "$DATA_MODEL_URL" \
            -o "$AI_DIR/$DATA_MODEL_FILE"

      - name: Save data model cache
        if: steps.cache-data-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.DATA_MODEL_FILE }}
          key: qwen25-coder-0.5b-q4km-v1

      - name: Restore llama.cpp CLI cache
        id: cache-llama
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AI_DIR }}/llama-cli
          key: llama-cli-ubuntu-x64-v3

      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          cmake \
            -S /tmp/llama.cpp \
            -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF

          cmake \
            --build /tmp/llama.cpp/build \
            --config Release \
            --target llama-cli \
            --parallel 4

          test -x /tmp/llama.cpp/build/bin/llama-cli

          cp \
            /tmp/llama.cpp/build/bin/llama-cli \
            "$AI_DIR/llama-cli"

          chmod +x "$AI_DIR/llama-cli"

      - name: Save llama.cpp CLI cache
        if: steps.cache-llama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AI_DIR }}/llama-cli
          key: llama-cli-ubuntu-x64-v3

      - name: Verify AI runtime
        run: |
          test -x "$AI_DIR/llama-cli"
          test -f "$AI_DIR/$CODE_MODEL_FILE"
          test -f "$AI_DIR/$DATA_MODEL_FILE"

          "$AI_DIR/llama-cli" --version

          echo
          echo "Models:"
          ls -lh \
            "$AI_DIR/$CODE_MODEL_FILE" \
            "$AI_DIR/$DATA_MODEL_FILE"

          echo
          echo "Module:"
          echo "${{ matrix.module }}"

      - name: Review ${{ matrix.module }}
        run: |
          python3 -u .ci/ai-review/review.py "${{ matrix.module }}"
