name: AI Review

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "modules/**"
      - ".ci/ai-review/**"
      - ".github/workflows/ai-review.yml"

permissions:
  contents: read

jobs:
  review:
    name: Review modules
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      AI_DIR: ${{ github.workspace }}/.ai
      MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare AI directory
        run: |
          mkdir -p "$AI_DIR"

      # -----------------------------------------------------------------------
      # Model
      # -----------------------------------------------------------------------

      - name: Restore model cache
        id: cache-model
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.MODEL_FILE }}
          key: qwen25-coder-3b-q4km-v1

      - name: Download model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "$MODEL_URL" \
            -o "$AI_DIR/$MODEL_FILE"

      - name: Save model cache
        if: steps.cache-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AI_DIR }}/${{ env.MODEL_FILE }}
          key: qwen25-coder-3b-q4km-v1

      # -----------------------------------------------------------------------
      # llama.cpp
      # -----------------------------------------------------------------------

      - name: Restore llama.cpp CLI cache
        id: cache-llama
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.AI_DIR }}/llama-cli
          key: llama-cli-ubuntu-x64-v3

      - name: Build llama.cpp
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          cmake \
            -S /tmp/llama.cpp \
            -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF

          cmake \
            --build /tmp/llama.cpp/build \
            --config Release \
            --target llama-cli \
            --parallel 4

          test -x /tmp/llama.cpp/build/bin/llama-cli

          cp \
            /tmp/llama.cpp/build/bin/llama-cli \
            "$AI_DIR/llama-cli"

          chmod +x "$AI_DIR/llama-cli"

      - name: Save llama.cpp CLI cache
        if: steps.cache-llama.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.AI_DIR }}/llama-cli
          key: llama-cli-ubuntu-x64-v3

      # -----------------------------------------------------------------------
      # Review
      # -----------------------------------------------------------------------

      - name: Verify AI runtime
        run: |
          test -x "$AI_DIR/llama-cli"
          test -f "$AI_DIR/$MODEL_FILE"

          "$AI_DIR/llama-cli" --version
          ls -lh "$AI_DIR/$MODEL_FILE"

          echo
          echo "AI review files:"
          ls -lah .ci/ai-review

      - name: Run AI review
        run: |
          python3 -u .ci/ai-review/review.py
